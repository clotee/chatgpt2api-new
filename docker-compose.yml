services:
  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yukkcat/chatgpt2api:latest}
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - chatgpt2api-runtime:/app
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      TZ: ${TZ:-Asia/Shanghai}
    # /version 是无需认证的公开端点；镜像内未安装 curl，使用系统 python3 探测。
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/version', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 资源限制示例（默认注释，不强制；取消注释后由 Docker Compose v2 生效）：
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 2G

volumes:
  chatgpt2api-runtime:
